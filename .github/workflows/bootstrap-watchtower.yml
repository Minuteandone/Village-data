name: Install Village Watchtower website

on:
  push:
    paths:
      - 'watchtower-package.zip'
      - '.github/workflows/bootstrap-watchtower.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack website, monitoring script and tests
        run: unzip -oq watchtower-package.zip
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_gitlab_watch.py' -v
      - name: Install checked files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts/gitlab_watch.py tests/test_gitlab_watch.py README-WATCHTOWER.md
          git rm watchtower-package.zip
          git commit -m "Add AI Village Watchtower website, scanner and tests"
          git push origin HEAD:main
      - name: Establish initial public GitLab baseline
        run: python scripts/gitlab_watch.py --output docs/data
      - name: Save first scan
        if: success()
        run: |
          git add docs/data/snapshot.json docs/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: establish GitLab Watchtower baseline"
            git push origin HEAD:main
          fi
